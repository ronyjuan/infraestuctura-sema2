version: '3.8'

services:
  api:
    build: .
    environment:
      - MESSAGE=${MESSAGE}
    ports:
      - "3000-3002:3000"
    deploy:
      replicas: 3

  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: